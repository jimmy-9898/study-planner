<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  color-scheme: light;
  --ink: #191B23; --night: #191B23; --deep: #191B23;
  --mist: #EEF0F4; --mist2: #E4E7ED; --paper: #FFFFFF;
  --border: #E1E4EA; --borderSoft: #EAECF1;
  --slate: #5B6472; --slateLight: #9098A6;
  --saffron: #E2962F; --saffronDark: #B96F17; --saffronSoft: #FBEAD2;
  --success: #2F9E6E; --successSoft: #DFF3EA;
  --danger: #D64545; --dangerSoft: #FBE2E2;
  --sky: #3B8FD6; --skySoft: #DEEEFA;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink: #E9ECF2; --night: #2A3042; --deep: #0B0D12;
    --mist: #0F1117; --mist2: #262B3B; --paper: #181B24;
    --border: #2C3244; --borderSoft: #232839;
    --slate: #A6AEBC; --slateLight: #7C8595;
    --saffron: #E8A13F; --saffronDark: #F0B65E; --saffronSoft: #3A2C17;
    --success: #4CBF90; --successSoft: #15352B;
    --danger: #F27272; --dangerSoft: #3B1D22;
    --sky: #5BA9E8; --skySoft: #15293C;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #E9ECF2; --night: #2A3042; --deep: #0B0D12;
  --mist: #0F1117; --mist2: #262B3B; --paper: #181B24;
  --border: #2C3244; --borderSoft: #232839;
  --slate: #A6AEBC; --slateLight: #7C8595;
  --saffron: #E8A13F; --saffronDark: #F0B65E; --saffronSoft: #3A2C17;
  --success: #4CBF90; --successSoft: #15352B;
  --danger: #F27272; --dangerSoft: #3B1D22;
  --sky: #5BA9E8; --skySoft: #15293C;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { height: 100%; margin: 0; background: var(--mist); color: var(--ink); font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
#root { height: 100%; }
.boot { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--slate); font: 500 15px/1.4 system-ui, sans-serif; }
</style>

    if (!Ctx) return;
    const ctx = new Ctx();

    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.55);

      try {
        ctx.close();
      } catch (e) {}
    }, 700);
  } catch (e) {}
